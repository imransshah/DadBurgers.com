name: Decolonized → GitHub Pages (legacy)

# Kept running until decolonized.therealdadburgers.com is cut over to
# Cloudflare (see sites/decolonized/README.md → "Moving to Cloudflare").
# Delete this file once the DNS points at the Cloudflare Worker.

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "sites/decolonized/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: sites/decolonized

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sites/decolonized/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_CHAT_API_URL: ${{ vars.CHAT_API_URL }}
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sites/decolonized/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
